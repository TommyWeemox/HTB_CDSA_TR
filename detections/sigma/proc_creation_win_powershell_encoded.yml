title: PowerShell encodé suspect
id: 6c2f1b0e-5a1d-4e2a-9f10-0a0b0c0d0e01
status: experimental
description: Détecte PowerShell lancé avec une commande encodée en base64
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
  condition: selection
falsepositives:
  - Scripts d'administration légitimes
level: medium

      - Splunk SPL: cheatsheets/splunk-spl.md
      - Elastic KQL / EQL: cheatsheets/elastic.md
      - Windows Event IDs: cheatsheets/windows-event-ids.md
      - Sysmon Event IDs: cheatsheets/sysmon.md
      - Réseau (Zeek / tshark / Suricata): cheatsheets/network.md

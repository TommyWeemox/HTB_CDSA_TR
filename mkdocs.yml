  - Plan d'étude:
      - study-plan/index.md
      - Planning 12 semaines: study-plan/12-weeks.md
      - Suivi de progression: study-plan/progress.md
      - Tableau de bord des quiz: study-plan/quizzes.md
  - HTB CDSA:
      - cdsa/index.md
      - Examen: cdsa/exam.md
      - "1. SOC, SIEM & Monitoring":
          - cdsa/01-siem/index.md
          - Le SOC: cdsa/01-siem/01-soc.md
          - Architecture d'un SIEM: cdsa/01-siem/02-architecture.md
          - Use cases & détection: cdsa/01-siem/03-use-cases.md
          - Triage & investigation: cdsa/01-siem/04-triage.md
          - Métriques & maturité: cdsa/01-siem/05-metrics.md
          - Labs: cdsa/01-siem/06-labs.md
          - Quiz: cdsa/01-siem/07-quiz.md
      - Windows Event Logs: cdsa/02-windows-event-logs.md
      - Threat Hunting (Elastic): cdsa/03-threat-hunting-elastic.md
      - Splunk: cdsa/04-splunk.md
      - Attaques Windows & défense: cdsa/05-windows-attacks.md
      - Network Traffic Analysis: cdsa/06-network-traffic-analysis.md
      - IDS / IPS: cdsa/07-ids-ips.md
      - Malware Analysis: cdsa/08-malware-analysis.md
      - Forensics: cdsa/09-forensics.md
      - Incident Handling: cdsa/10-incident-handling.md
  - MITRE ATT&CK Defender:
      - mad/index.md
      - ATT&CK Fundamentals: mad/fundamentals.md
      - Cyber Threat Intelligence: mad/cti.md
      - SOC Assessments: mad/soc-assessments.md
      - Threat Hunting & Detection: mad/hunting-detection.md
      - Adversary Emulation: mad/adversary-emulation.md
      - Tactiques ATT&CK: mad/tactics.md
  - Threat Hunting:
      - hunting/index.md
      - Méthodologie: hunting/methodology.md
      - Playbook de hypothèses: hunting/hypotheses.md
  - Detection Engineering:
      - detection-engineering/index.md
      - Sigma: detection-engineering/sigma.md
      - Cycle de vie d'une détection: detection-engineering/lifecycle.md
